# fly.toml app configuration file generated for food-telegram-bot on 2026-01-19T04:21:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'food-telegram-bot'
primary_region = 'iad'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[processes]
app = "python telegram_food_bot.py"



